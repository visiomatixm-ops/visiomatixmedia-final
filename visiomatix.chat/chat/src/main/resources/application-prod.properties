# Production Profile Configuration

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# JPA / Hibernate Configuration
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Logging
logging.level.root=INFO
logging.level.com.visiomatix=${LOG_LEVEL_COM_VISIOMATIX:INFO}
logging.level.org.springframework=${LOG_LEVEL_SPRING:INFO}
logging.level.org.hibernate.SQL=ERROR

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:migration

# Chat session expiry/cleanup
chat.session.timeout.duration=${CHAT_SESSION_TIMEOUT:14400000}
chat.session.cleanup.interval=${CHAT_CLEANUP_INTERVAL:3600000}
chat.session.inactive.threshold=${CHAT_INACTIVE_THRESHOLD:900000}

# Security
server.error.include-message=never
server.error.include-stacktrace=never