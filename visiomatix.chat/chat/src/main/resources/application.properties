# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/live_chat_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=MySQL123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.show-sql=true
# Remove explicit dialect (Spring Boot auto-detects for MySQL)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=3600000

logging.config=classpath:logback-spring.xml
logging.level.com.visiomatix=DEBUG
logging.level.org.springframework=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Flyway
spring.flyway.enabled=false
spring.flyway.locations=classpath:migration
spring.jpa.hibernate.ddl-auto=update

# Chat session expiry/cleanup
chat.session.timeout.duration=14400000
chat.session.cleanup.interval=3600000    # run cleanup every hour (ms)
chat.session.inactive.threshold=900000   # optional: consider inactive threshold (15m) for auto-close earlier

